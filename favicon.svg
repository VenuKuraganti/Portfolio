<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Background -->
  <rect x="1" y="1" width="30" height="30" rx="7" ry="7" fill="#0c1526" stroke="#39485f" stroke-width="1"/>

  <!-- Sparkle (top-left accent) -->
  <g stroke="#f4c430" stroke-width="1.4" stroke-linecap="round" fill="none">
    <line x1="6.6" y1="10.6" x2="9.2" y2="13" />
    <line x1="8.6" y1="7.4" x2="9.4" y2="10.4" />
    <line x1="11.4" y1="8.6" x2="10.2" y2="11.4" />
  </g>

  <!-- VGK wordmark -->
  <text x="16" y="24"
        font-family="Arial, Helvetica, sans-serif"
        font-weight="900"
        font-size="13.5"
        letter-spacing="-0.6"
        fill="#ffffff"
        text-anchor="middle"
        font-style="italic">VGK</text>
</svg>
